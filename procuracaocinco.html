<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Procuração de Amplos Poderes</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
    body {
        font-family: 'Arial', sans-serif;
        background-color: #eef2f7;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }

    .container {
        background: #ffffff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        max-width: 700px;
        width: 100%;
    }

    h1 {
        color: #8b0000;
        text-align: center;
        border-bottom: 2px solid #8b0000;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }

    p {
        text-align: center;
        color: #555;
        margin-bottom: 20px;
    }

    fieldset {
        border: 1px solid #ccc;
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 5px;
    }

    legend {
        font-weight: bold;
        color: #004d99;
        padding: 0 10px;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;
        color: #333;
    }

    input[type="text"], input[type="date"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    button {
        background-color: #8b0000;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 30px;
        width: 100%;
        font-size: 16px;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #6a0000;
    }

/* Estilos do Menu de Navegação */
.navbar {
    background-color: blueviolet;
    color: white;
    /* Ajuste de padding: vertical mantido, horizontal reduzido para segurança */
    padding: var(--spacing-lg) var(--spacing-md); 
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    /* O ajuste principal: garante que o padding fique DENTRO dos 100% de largura */
    box-sizing: border-box; 
    z-index: 1000;
}

.logo p {
    color: white;
    font-size: var(--font-size-lg);
    font-weight: bold;
    margin: 0; /* Remove margens que podem desalinhada o flex */
}

.menu ul {
    list-style: none;
    display: flex;
    /* Reduzido de 50px para 30px para evitar que o item 'Sair' seja expulso da tela */
    gap: 30px; 
    margin: 0;
    padding: 0;
}

.menu ul li a {
    color: white;
    text-decoration: none;
    font-size: var(--font-size-md);
    transition: color 0.3s, background-color 0.3s;
    padding: var(--spacing-xs) 0;
    display: block;
    /* Impede que o texto quebre linha em telas menores */
    white-space: nowrap; 
}

.menu ul li a:hover,
.menu ul li a:focus {
    color: #ffd700;
    outline: none;
}

.menu-icon {
    font-size: var(--font-size-xl);
    display: none;
    cursor: pointer;
    color: white;
    outline: 2px solid transparent;
    outline-offset: 4px;
    transition: outline-color 0.3s ease;
}

.menu-icon:focus {
    outline-color: #ffd700;
}

.menu-toggle {
    display: none;
}

/* Responsividade - Mobile */
@media (max-width: 768px) {
    body {
        padding-top: 65px;
    }
    .navbar {
        padding: var(--spacing-md) var(--spacing-lg);
    }
    .logo p {
        font-size: 1.4em;
    }
    .menu ul {
        flex-direction: column;
        position: absolute;
        top: 65px;
        left: 0;
        background-color: blueviolet; /* Ajustado para manter a cor do menu */
        width: 100%;
        display: none;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        gap: 0;
        max-height: calc(100vh - 65px);
        overflow-y: auto;
    }
    .menu ul li {
        padding: var(--spacing-md) var(--spacing-xl);
        border-top: 1px solid rgba(255, 255, 255, 0.2);
    }
    .menu ul li:first-child {
        border-top: none;
    }
    .menu-icon {
        display: block;
    }
    .menu-toggle:checked + .menu-icon + .menu ul {
        display: flex;
    }
}

/* Ajustes finos para telas muito pequenas */
@media (max-width: 480px) {
    .navbar {
        padding: var(--spacing-sm) var(--spacing-md);
    }
    .logo p {
        font-size: 1.2em;
    }
}


</style>    

</head>
<body>

<header class="navbar">
        <div class="logo">
            <b><p>S. G. D. A.</p></b>
        </div>

        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon" aria-label="Abrir Menu">&#9776;</label>

        <nav class="menu">
        <ul>
            <li><a href="geracaodocumentosadv.html">Voltar Geração de Documentos</a></li>
            <li><a href="index.html">Sair</a></li>
        </ul>
    </nav>
    </header>


    <div class="container">
        <h1>Procuração de Amplos Poderes</h1>
        <p>Preencha os dados abaixo para gerar o PDF formatado.</p>
        
        <form id="form-procuracao">
            <fieldset>
                <legend>Dados do Outorgante (Cliente)</legend>
                <label for="outorgante-nome">Nome Completo:</label>
                <input type="text" id="outorgante-nome" required>
                
                <label for="outorgante-qualificacao">Nacionalidade, Estado Civil e Profissão:</label>
                <input type="text" id="outorgante-qualificacao" required>
                
                <label for="outorgante-cpf">CPF/MF:</label>
                <input type="text" id="outorgante-cpf" required>

                <label for="outorgante-endereco">Endereço Residencial Completo:</label>
                <input type="text" id="outorgante-endereco" required placeholder="Rua, nº, Bairro, Cidade/UF">
            </fieldset>

            <fieldset>
                <legend>Dados do Outorgado (Advogado)</legend>
                <label for="outorgado-nome">Nome Completo do Advogado:</label>
                <input type="text" id="outorgado-nome" required>
                
                <label for="outorgado-oab">OAB/UF:</label>
                <input type="text" id="outorgado-oab" required>
                
                <label for="outorgado-endereco">Endereço Profissional:</label>
                <input type="text" id="outorgado-endereco" required>
            </fieldset>

            <fieldset>
                <legend>Local e Data da Assinatura</legend>
                <label for="assinatura-cidade">Cidade/UF:</label>
                <input type="text" id="assinatura-cidade" required>
                
                <label for="assinatura-data">Data:</label>
                <input type="date" id="assinatura-data" required>
            </fieldset>

            <button type="button" onclick="gerarProcuracaoAmplosPoderes()">Gerar PDF de Amplos Poderes</button>
        </form>
    </div>

    <script>
        // Define data de hoje como padrão no input
        document.getElementById('assinatura-data').valueAsDate = new Date();

        function gerarProcuracaoAmplosPoderes() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4'); 

            // Coleta de Dados
            const nomeOut = document.getElementById('outorgante-nome').value;
            const qualOut = document.getElementById('outorgante-qualificacao').value;
            const cpfOut = document.getElementById('outorgante-cpf').value;
            const endOut = document.getElementById('outorgante-endereco').value;

            const nomeAdv = document.getElementById('outorgado-nome').value;
            const oabAdv = document.getElementById('outorgado-oab').value;
            const endAdv = document.getElementById('outorgado-endereco').value;

            const cidadeAssinatura = document.getElementById('assinatura-cidade').value;
            const dataInput = document.getElementById('assinatura-data').value;
            
            // Formata data de YYYY-MM-DD para DD/MM/YYYY
            const dataFormatada = dataInput.split('-').reverse().join('/');

            let y = 30; // Margem superior

            // Função para adicionar texto justificando e evitando cortes
            function addText(text, isBold = false, fontSize = 11) {
                doc.setFont("helvetica", isBold ? "bold" : "normal");
                doc.setFontSize(fontSize);
                
                // Margens: 20mm esquerda, largura útil de 170mm (sobra 20mm direita)
                const lines = doc.splitTextToSize(text, 170); 
                
                // Verifica se precisa de nova página (opcional para documentos curtos)
                if (y + (lines.length * 6) > 280) {
                    doc.addPage();
                    y = 20;
                }

                doc.text(lines, 20, y, { align: "justify", maxWidth: 170 }); 
                y += (lines.length * 6) + 4; 
            }
            
            // --- Título ---
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("PROCURAÇÃO AD JUDICIA ET EXTRA", 105, y, { align: "center" });
            y += 15;

            // --- Qualificação Outorgante ---
            const textoOutorgante = `${nomeOut}, ${qualOut}, inscrito(a) no CPF/MF sob o nº ${cpfOut}, residente e domiciliado(a) na ${endOut}, nomeia e constitui seu(s) bastante(s) procurador(es) o(s) seguinte(s):`;
            addText(textoOutorgante);

            // --- Qualificação Outorgado ---
            const textoOutorgado = `OUTORGADO: ${nomeAdv}, advogado(a), inscrito(a) na OAB sob o nº ${oabAdv}, com escritório profissional em ${endAdv}.`;
            addText(textoOutorgado, true);

            y += 5;

            // --- Cláusula Ad Judicia ---
            addText("CLÁUSULA AD JUDICIA ET EXTRA:", true, 12);
            addText("Confere-lhe(s) amplos poderes para o foro em geral, em qualquer Juízo, Instância ou Tribunal, podendo propor ações, contestar, recorrer, transigir, desistir, firmar compromissos, receber valores, dar e receber quitação, e tudo mais que se fizer necessário para o bom e fiel desempenho deste mandato.");

            y += 5;

            // --- Poderes Específicos ---
            addText("PODERES ESPECÍFICOS (Art. 105, § 4º, do CPC):", true, 12);
            addText("Concede-lhe(s) os poderes especiais para: receber citação, confessar, reconhecer a procedência do pedido, transigir, desistir, renunciar ao direito sobre o qual se funda a ação, receber, dar quitação, firmar compromisso e assinar declaração de hipossuficiência econômica.");

            y += 15;

            // --- Local e Data ---
            doc.setFont("helvetica", "normal");
            doc.text(`${cidadeAssinatura}, ${dataFormatada}.`, 20, y);

            // --- Assinaturas ---
            y += 30;
            doc.line(50, y, 160, y); // Linha da assinatura
            y += 5;
            doc.setFont("helvetica", "bold");
            doc.text(`Outorgante: ${nomeOut}`, 105, y, { align: "center" });
            
            y += 25;
            doc.line(50, y, 160, y); // Linha da assinatura
            y += 5;
            doc.text(`Outorgado: ${nomeAdv}`, 105, y, { align: "center" });

            // Salvar PDF
            doc.save(`Procuracao_${nomeOut.replace(/\s/g, '_')}.pdf`);
        }
    </script>
</body>
</html>
